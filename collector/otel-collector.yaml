# OTel Collector — Path A instrumentation
#
# Required env vars (set in /etc/otelcol/otelcol.env or systemd EnvironmentFile):
#   GRAFANA_OTLP_ENDPOINT  — e.g. https://otlp-gateway-prod-us-central-0.grafana.net/otlp
#   GRAFANA_OTLP_AUTH      — base64(<grafana-instance-id>:<grafana-api-token>)
#   OTEL_SERVICE_NAME      — e.g. nr-sandbox (passed through to resource attributes)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      network: {}
      load: {}
      process:
        # Scrapes all running processes — the core of the process-visibility demo.
        # Requires the collector to run as root (or with CAP_SYS_PTRACE) to see
        # processes owned by other users (nginx, redis, etc.).
        mute_process_name_error: true
        mute_process_exe_error: true
        metrics:
          process.cpu.time:
            enabled: true
          process.memory.usage:
            enabled: true
          process.memory.virtual:
            enabled: true
          process.disk.io:
            enabled: true

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  # Copy process identity from Resource attributes → DataPoint attributes so they
  # become queryable Prometheus labels. Without this, process.executable.name lives
  # at the Resource level and is invisible to PromQL.
  transform/process_labels:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["process_executable_name"], resource.attributes["process.executable.name"])
          - set(attributes["process_pid"], resource.attributes["process.pid"])
          - set(attributes["process_owner"], resource.attributes["process.owner"])

  resourcedetection:
    detectors: [ec2, env]
    timeout: 5s

exporters:
  otlphttp:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      authorization: "Basic ${env:GRAFANA_OTLP_AUTH}"
    compression: gzip

  prometheus:
    endpoint: "0.0.0.0:9464"

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn

  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlphttp]

    metrics:
      receivers: [otlp, hostmetrics]
      processors: [resourcedetection, batch, transform/process_labels]
      exporters: [otlphttp, prometheus]

    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlphttp]
